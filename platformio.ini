; Rescue Boat — PlatformIO Multi-Environment Configuration
; Two environments: classic ESP32 sensor controller (boat) and separate ESP32-CAM

[platformio]
default_envs = boat, cam
src_dir = .

; ============================================================
; BOAT SENSOR CONTROLLER — classic ESP32-WROOM-32U, CP2102 UART, 4MB Flash
; ============================================================
[env:boat]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<boat-controller/src/>

build_flags =
    -DBOAT_FIRMWARE
    -DDEBUG_ENABLED

lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit BNO055@^1.6.1
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit INA219@^1.2.3
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^6.21.4

; ============================================================
; CAMERA STREAMER — ESP32-CAM (AI-Thinker OV2640 Module)
; ============================================================
[env:cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<cam-streamer/src/>

build_flags =
    -DCAM_FIRMWARE
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEBUG_ENABLED
