; Rescue Boat — PlatformIO Multi-Environment Configuration
; Two environments: boat (ESP32-S3) and shore (ESP32 WROOM-32U)

[platformio]
default_envs = boat, cam
src_dir = .
lib_dir = shared

; ============================================================
; BOAT CONTROLLER — ESP32-S3 (N8R8, 8MB Flash, 8MB PSRAM)
; ============================================================
[env:boat]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.psram = enabled
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<../boat-controller/src/>

build_flags =
    -DBOAT_FIRMWARE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DDEBUG_ENABLED

lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit BNO055@^1.6.1
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit INA219@^1.2.3
    me-no-dev/ESPAsyncWebServer@^1.2.6
    me-no-dev/AsyncTCP@^1.1.1
    bblanchon/ArduinoJson@^6.21.4

; ============================================================
; CAMERA STREAMER — ESP32-CAM (AI-Thinker OV2640 Module)
; ============================================================
[env:cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<../cam-streamer/src/>

build_flags =
    -DCAM_FIRMWARE
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEBUG_ENABLED
